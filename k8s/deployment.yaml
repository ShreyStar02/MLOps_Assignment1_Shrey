apiVersion: apps/v1
kind: Deployment
metadata:
    name: heart-api
    labels:
        app: heart-api
spec:
    replicas: 2
    selector:
        matchLabels:
            app: heart-api
    template:
        metadata:
            labels:
                app: heart-api
        spec:
            containers:
                - name: heart-api
                  image: heart-api:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 8000
                  readinessProbe:
                      httpGet: { path: /health, port: 8000 }
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet: { path: /health, port: 8000 }
                      initialDelaySeconds: 15
                      periodSeconds: 20
                  resources:
                      requests: { cpu: 100m, memory: 256Mi }
                      limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
    name: heart-api
    labels:
        app: heart-api
spec:
    type: LoadBalancer
    selector:
        app: heart-api
    ports:
        - name: http
          port: 80
          targetPort: 8000
