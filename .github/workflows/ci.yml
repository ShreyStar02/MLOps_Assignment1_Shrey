name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    lint-test-train:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Lint (flake8)
              run: flake8 src api scripts tests

            - name: Unit tests
              run: pytest --cov=src --cov=api --cov-report=xml --cov-report=term -v

            - name: Download and clean data
              run: python scripts/download_data.py

            - name: Train model (MLflow tracked)
              shell: bash
              run: python src/train.py 2>&1 | tee train.log

            - name: Build Docker image
              run: docker build -t heart-api:ci .

            - name: Smoke-test container
              run: |
                  docker run -d --name heart -p 8000:8000 heart-api:ci
                  for i in $(seq 1 20); do curl -sf localhost:8000/health && break || sleep 2; done
                  curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' \
                    -d '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":2,"thalach":150,"exang":0,"oldpeak":2.3,"slope":3,"ca":0,"thal":6}'
                  docker logs heart
                  docker rm -f heart

            - name: Upload artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: ci-artifacts
                  path: |
                      train.log
                      coverage.xml
                      models/
                      reports/figures/
                      mlflow.db
